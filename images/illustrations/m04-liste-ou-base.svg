    <text x="44" y="252" font-size="12" fill="#7b6f63">Impossible de trier ou de filtrer.</text>

    <path d="M326 150 H392" stroke="#7a5a45" stroke-width="2.5"/><path d="M382 140 L394 150 L382 160" fill="none" stroke="#7a5a45" stroke-width="2.5"/>

