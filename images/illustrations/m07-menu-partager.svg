    <circle cx="180" cy="278" r="12" fill="#7a5a45"/><text x="180" y="282" text-anchor="middle">4</text>
  </g>
  <g font-size="12" fill="#33281f">
    <text x="580" y="96">Inviter quelqu'un</text><text x="580" y="158">Qui a accès,</text><text x="580" y="174">et à quel niveau</text><text x="580" y="228">Qui d'autre peut</text><text x="580" y="244">ouvrir le lien</text><text x="580" y="282">Le lien de la page</text>
