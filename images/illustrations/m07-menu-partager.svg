<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, system-ui, sans-serif">
  <rect width="720" height="320" rx="16" fill="#eee6d9"/>
  <rect x="200" y="20" width="360" height="280" rx="12" fill="#fffdf8" stroke="#e6ddd0"/>
  <g font-size="13" fill="#33281f">
    <text x="222" y="50" font-weight="700">Partager</text><text x="300" y="50" fill="#7b6f63">Publier</text>
    <path d="M222 58 H282" stroke="#47342c" stroke-width="2"/><path d="M212 62 H548" stroke="#e6ddd0"/>
    <rect x="222" y="76" width="236" height="32" rx="6" fill="#fffdf8" stroke="#e6ddd0"/><text x="232" y="97" fill="#7b6f63">E-mail ou nom…</text>
    <rect x="468" y="76" width="74" height="32" rx="6" fill="#7a5a45"/><text x="505" y="97" text-anchor="middle" fill="#fdf9f3" font-weight="600">Inviter</text>
    <text x="222" y="140">Emma (toi)</text><text x="542" y="140" text-anchor="end" fill="#7b6f63">Accès complet</text>
    <text x="222" y="168">Lucas</text><text x="542" y="168" text-anchor="end" fill="#7b6f63">Peut modifier ▾</text>
    <path d="M212 186 H548" stroke="#e6ddd0"/>
    <text x="222" y="212" font-weight="600">Accès général</text>
    <text x="222" y="236">Seules les personnes invitées ▾</text>
    <path d="M212 256 H548" stroke="#e6ddd0"/>
