    <path d="M84 212 H106 M84 220 H106 M84 228 H98" stroke="#7a5a45" stroke-width="2"/>
    <text x="95" y="252" text-anchor="middle" font-size="12" fill="#33281f">Un carnet</text>
  </g>

  <g transform="rotate(-5 225 228)">
    <rect x="175" y="192" width="100" height="72" rx="10" fill="#fffdf8" stroke="#e6ddd0"/>
    <path d="M200 210 H218 L223 216 H250 V238 H200 Z" fill="none" stroke="#6b7a5c" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="225" y="256" text-anchor="middle" font-size="12" fill="#33281f">Un dossier</text>
  </g>

  <!-- Flèche -->
  <path d="M310 165 H385" stroke="#7a5a45" stroke-width="4" stroke-linecap="round"/>
  <path d="M372 150 L390 165 L372 180" fill="none" stroke="#7a5a45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

