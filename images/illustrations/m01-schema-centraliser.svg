  <text x="545" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#7b6f63">Avec Notion</text>
  <rect x="420" y="58" width="250" height="220" rx="12" fill="#fffdf8" stroke="#e6ddd0"/>
  <path d="M420 70 a12 12 0 0 1 12 -12 H658 a12 12 0 0 1 12 12 V88 H420 Z" fill="#f6f1e8"/>
  <rect x="434" y="66" width="16" height="16" rx="4" fill="#47342c"/>
  <text x="442" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#fdf9f3">S</text>
  <text x="458" y="78" font-size="12" font-weight="600" fill="#33281f">Studio Nova</text>
  <line x1="420" y1="88" x2="670" y2="88" stroke="#e6ddd0"/>

  <g font-size="13" fill="#33281f">
