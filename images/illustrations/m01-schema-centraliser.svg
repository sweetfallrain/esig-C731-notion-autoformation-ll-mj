    <path d="M70 88 L95 106 L120 88" fill="none" stroke="#7a5a45" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="95" y="134" text-anchor="middle" font-size="12" fill="#33281f">Un mail</text>
  </g>

  <g transform="rotate(5 225 100)">
